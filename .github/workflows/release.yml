# 태그(v1.0.0 등)를 올리면 리눅스·윈도우·맥용 설치판을 빌드해 GitHub Releases에 올린다.
# 받는 사람은 .NET이나 Rust를 설치할 필요 없이 압축을 풀고 start 스크립트를 실행하면 된다.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Rust 엔진 테스트
        run: cargo test --release --manifest-path engine/Cargo.toml

      - name: 배포판 만들기 (자체 포함, Rust 엔진 포함)
        run: dotnet publish server -c Release -r ${{ matrix.rid }} --self-contained true -o out/GoArcade

      - name: 압축 (리눅스·맥)
        if: runner.os != 'Windows'
        run: |
          rm -f out/GoArcade/*.pdb
          chmod +x out/GoArcade/GoArcade out/GoArcade/start.sh
          tar -czf GoArcade-${{ matrix.rid }}.tar.gz -C out GoArcade

      - name: 압축 (윈도우)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item out/GoArcade/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path out/GoArcade -DestinationPath GoArcade-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GoArcade-${{ matrix.rid }}
          path: GoArcade-${{ matrix.rid }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
